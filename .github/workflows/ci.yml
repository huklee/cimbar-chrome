name: extension-ci

on:
  push:
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test ZIP and validation core
        run: npm test

      - name: Validate manifest and bundled WASM
        run: npm run check

      - name: Build distributable extension archive
        run: npm run package

      - name: Verify distributable archive
        run: unzip -t cimbar-text-bundle-extension.zip
